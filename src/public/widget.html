<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        height: 100%;
        overflow: hidden;
      }

      /* Highly visible subtitle styling */
      #subtitles {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 5%;
        padding: 0 3vw;
        width: 100%;
        text-align: center;
        color: #ffd54f; /* warm yellow */
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, sans-serif;
        font-weight: 900;
        font-size: 56px;
        line-height: 1.2;
        letter-spacing: 0.3px;
        /* strong shadow for readability on any background */
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.7),
          2px 2px 0 rgba(0, 0, 0, 0.9);
        -webkit-text-stroke: 1px rgba(0, 0, 0, 0.9);
        z-index: 10;
      }

      /* Two-line subtitle layout */
      #subtitles .translated {
        color: #ffd54f;
        font-weight: 900;
        font-size: 56px;
        line-height: 1.2;
        letter-spacing: 0.3px;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.9),
          0 0 20px rgba(0, 0, 0, 0.7), 2px 2px 0 rgba(0, 0, 0, 0.9);
        -webkit-text-stroke: 1px rgba(0, 0, 0, 0.9);
      }

      #subtitles .original {
        margin-top: 6px;
        color: #ffffff;
        opacity: 0.95;
        font-weight: 700;
        font-size: 36px;
        line-height: 1.25;
        letter-spacing: 0.2px;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 1px 1px 0 rgba(0, 0, 0, 0.9);
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.9);
      }

      /* target language badge removed per user request */

      /* Connection status indicator */
      #status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12%;
        width: 100%;
        text-align: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.2px;
        opacity: 0;
        transition: opacity 200ms ease;
        pointer-events: none;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 1px 1px 0 rgba(0, 0, 0, 0.9);
        z-index: 20;
      }
      #status.ok {
        color: #9ccc65;
      }
      #status.warn {
        color: #ffb74d;
      }
      #status.error {
        color: #ef5350;
      }

      /* Scale down on smaller canvases */
      @media (max-width: 800px) {
        #subtitles .translated { font-size: 40px; }
        #subtitles .original { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <div id="status" aria-live="polite" aria-atomic="true"></div>
    <div id="subtitles"></div>
    <script>
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const url = `${protocol}://${location.host}`;

      const el = document.getElementById("subtitles");
      const statusEl = document.getElementById("status");
      let ws = null;
      let retries = 0;
      let hideStatusTimer = null;
      const CLEAR_AFTER_MS = 5000; // clear stale captions after 5s disconnected
      let clearSubtitleTimer = null;

      function setStatus(message, type = "warn", persist = false) {
        if (!statusEl) return;
        statusEl.textContent = message || "";
        statusEl.className = type;
        statusEl.style.opacity = message ? 1 : 0;
        if (hideStatusTimer) clearTimeout(hideStatusTimer);
        if (!persist && message) {
          hideStatusTimer = setTimeout(() => {
            statusEl.style.opacity = 0;
          }, 1500);
        }
      }

      function connect() {
        try {
          ws = new WebSocket(url);
        } catch (err) {
          scheduleReconnect();
          return;
        }

        ws.onopen = () => {
          retries = 0;
          console.debug("[Widget] WebSocket connected");
          setStatus("Connected", "ok");
          cancelClearSubtitles();
        };

        ws.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data || "{}");
            if (typeof data.text === "string") {
              const translated = String(data.text || "");
              const original =
                typeof data.originalText === "string" ? String(data.originalText) : null;
              // target language is ignored in the UI
              el.innerHTML = renderSubtitles(translated, original);
            }
          } catch (err) {
            // ignore malformed messages
          }
          cancelClearSubtitles();
        };

        ws.onclose = () => {
          console.debug("[Widget] WebSocket closed; scheduling reconnect");
          setStatus(
            "Subtitle server disconnected. Reconnecting…",
            "warn",
            true
          );
          scheduleReconnect();
          scheduleClearSubtitles();
        };

        ws.onerror = () => {
          setStatus(
            "Subtitle server connection error. Reconnecting…",
            "error",
            true
          );
          try {
            ws && ws.close();
          } catch (_) {}
          scheduleClearSubtitles();
        };
      }

      function scheduleReconnect() {
        retries += 1;
        // Exponential backoff with jitter, capped at 10s
        const base = Math.min(1000 * Math.pow(2, retries - 1), 10000);
        const delay = base + Math.floor(Math.random() * 300);
        setStatus("Reconnecting to subtitle server...", "warn", true);
        setTimeout(connect, delay);
      }

      function scheduleClearSubtitles() {
        if (clearSubtitleTimer) clearTimeout(clearSubtitleTimer);
        clearSubtitleTimer = setTimeout(() => {
          el.innerHTML = "";
        }, CLEAR_AFTER_MS);
      }

      function cancelClearSubtitles() {
        if (clearSubtitleTimer) {
          clearTimeout(clearSubtitleTimer);
          clearSubtitleTimer = null;
        }
      }

      window.addEventListener("beforeunload", () => {
        try {
          ws && ws.close();
        } catch (_) {}
      });

      setStatus("Connecting…", "warn");

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderSubtitles(translated, original) {
        const t = escapeHtml(translated);
        if (!original) {
          return `<div class="translated">${t}</div>`;
        }
        const o = escapeHtml(original);
        return `<div class="translated">${t}</div><div class="original">${o}</div>`;
      }

      connect();
    </script>
  </body>
</html>
